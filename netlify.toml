[build]
  command = "npm run build"
  publish = "dist/capacitor-plugins-docs/browser"

[build.environment]
  NODE_VERSION = "24"

# Legacy Netlify hostname: force every path onto the Cloudflare production origin.
[[redirects]]
  from = "/*"
  to = "https://docs.rdlabo.dev/:splat"
  status = 301
  force = true
